name: Canonicalize home USDC GHS rate

"on":
  push:
    branches:
      - fix/home-canonical-usdc-ghs-rate

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch home rate model and labels
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/services/home_summary_service.dart')
          s = p.read_text()
          s = s.replace("  final double usdToGhs;\n", "  /// Canonical USDC→GHS retail rate.\n  final double usdToGhs; // legacy field name kept for compatibility\n  final String pair;\n  final String settlementCurrency;\n  final String displayCurrency;\n  final bool isCanonical;\n", 1)
          s = s.replace("    required this.usdToGhs,\n    required this.retailRate,", "    required this.usdToGhs,\n    required this.pair,\n    required this.settlementCurrency,\n    required this.displayCurrency,\n    required this.isCanonical,\n    required this.retailRate,", 1)
          s = s.replace("    usdToGhs: 0,\n    retailRate: 0,", "    usdToGhs: 0,\n    pair: 'USDC/GHS',\n    settlementCurrency: 'USDC',\n    displayCurrency: 'GHS',\n    isCanonical: false,\n    retailRate: 0,", 1)
          s = s.replace("  bool get isAvailable => usdToGhs > 0;", "  bool get isAvailable => isCanonical && usdToGhs > 0;")
          old = """      return _Section(\n        rates: OracleRates(\n          usdToGhs: _asDouble(data['liveUsdToGhs']),\n          retailRate: _asDouble(data['liveRetailRate']),\n          corporateRate: _asDouble(data['liveCorporateRate']),\n          source: data['rateSource']?.toString() ?? 'UNKNOWN',\n          lastSync: _asDate(data['lastSync']),\n        ),\n      );"""
          new = """      final pair = data['pair']?.toString() ?? '';\n      final settlement = data['settlementCurrency']?.toString() ?? '';\n      final display = data['displayCurrency']?.toString() ?? '';\n      final retail = _asDouble(data['liveRetailRate']);\n      final canonical = pair.toUpperCase() == 'USDC/GHS' &&\n          settlement.toUpperCase() == 'USDC' &&\n          display.toUpperCase() == 'GHS' &&\n          retail > 0;\n      return _Section(\n        rates: OracleRates(\n          // Keep the legacy property populated for existing consumers, but\n          // source it from the canonical retail rate so it cannot silently\n          // display the headline USD/GHS rate.\n          usdToGhs: canonical ? retail : 0,\n          pair: pair,\n          settlementCurrency: settlement,\n          displayCurrency: display,\n          isCanonical: canonical,\n          retailRate: retail,\n          corporateRate: _asDouble(data['liveCorporateRate']),\n          source: data['rateSource']?.toString() ?? 'UNKNOWN',\n          lastSync: _asDate(data['lastSync']),\n        ),\n      );"""
          if old not in s: raise SystemExit('home_summary rate constructor anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('lib/providers/home_summary_provider.dart')
          s = p.read_text()
          s = s.replace("        final rate = fresh.rates.usdToGhs;", "        final rate = fresh.rates.retailRate;", 1)
          p.write_text(s)

          p = Path('lib/widgets/live_market_section.dart')
          s = p.read_text()
          s = s.replace('USD->GHS', 'USDC->GHS')
          s = s.replace('USD→GHS', 'USDC→GHS')
          s = s.replace("label: 'USD',", "label: 'USDC',", 1)
          s = s.replace("'1 USD = ${rates.usdToGhs.toStringAsFixed(2)} GHS'", "'1 USDC = ${rates.usdToGhs.toStringAsFixed(2)} GHS'", 1)
          s = s.replace("_RateAlertRow(colors: colors, currentRate: rates.usdToGhs)", "_RateAlertRow(colors: colors, currentRate: rates.retailRate)", 1)
          s = s.replace("        final rate = fresh.rates.usdToGhs;", "        final rate = fresh.rates.retailRate;", 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/once-home-canonical-rate.yml
          git add lib/services/home_summary_service.dart lib/providers/home_summary_provider.dart lib/widgets/live_market_section.dart .github/workflows/once-home-canonical-rate.yml
          git diff --cached --check
          git commit -m 'fix: make home rate surface canonical USDC/GHS'
          git push origin HEAD:fix/home-canonical-usdc-ghs-rate
