# Production-connected Android device smoke build.
#
# Android Integration builds with a PLACEHOLDER Firebase configuration and the
# default dev backend, which is fine for compile/integration gating but useless
# on a real phone. This workflow produces an INSTALLABLE debug APK wired to the
# PRODUCTION backend via --dart-define=ENV=prod and the REAL Firebase
# configuration.
#
# Firebase configuration comes from the same canonical repository secret the
# Android Integration workflow reads: GOOGLE_SERVICES_JSON, raw JSON content.
# There is no second, separately-encoded copy. google-services.json is never
# committed, and its contents are never echoed: only validation verdicts and the
# package name are printed.
#
# The Web OAuth client id comes from the repository variable
# GOOGLE_SERVER_CLIENT_ID and is passed to the build as a dart-define, because
# Google id-token issuance on Android needs the WEB client id (client_type 3),
# not the Android client id and never a client secret.
#
# Dispatch-only. It fails early and loudly when the configuration or the OAuth
# client id is missing: a device build that looks production-connected but
# cannot sign anyone in is worse than no build.

name: Android Prod Smoke Build

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Backend environment for the device smoke APK"
        required: true
        type: choice
        options:
          - prod
        default: prod

permissions:
  contents: read

concurrency:
  group: android-prod-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-prod-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in lockstep with android-integration.yml / flutter-ci.yml.
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo rm -rf /opt/ghc

      # Fails early and clearly when either half of the Firebase/OAuth pair is
      # missing, and refuses a configuration that does not match this project and
      # package. A malformed secret never degrades into a placeholder here.
      - name: Write and validate Android Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "::error::Required secret GOOGLE_SERVICES_JSON is missing or empty. Add the raw google-services.json content in repository Settings -> Secrets -> Actions -> Actions secrets before dispatching this workflow."
            exit 1
          fi
          if [ -z "${GOOGLE_SERVER_CLIENT_ID:-}" ]; then
            echo "::error::Required variable GOOGLE_SERVER_CLIENT_ID is missing or empty. Add the Web OAuth client id (client_type 3) from the Firebase configuration in repository Settings -> Secrets -> Actions -> Actions variables. Without it Google Sign-In cannot issue an id token on Android."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          test -s android/app/google-services.json
          python3 tool/ci/validate_google_services.py \
            --file android/app/google-services.json \
            --project azaman-app \
            --package com.azaman.app \
            --server-client-id "$GOOGLE_SERVER_CLIENT_ID" \
            --label "prod smoke firebase"
          {
            echo "### Firebase configuration"
            echo ""
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| source | raw JSON from the canonical repository secret |"
            echo "| project | \`azaman-app\` |"
            echo "| package | \`com.azaman.app\` |"
            echo "| Web OAuth client | supplied and matched against the configuration |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build production-connected debug APK
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          set -euo pipefail
          flutter build apk \
            --debug \
            --dart-define=ENV=${{ inputs.environment }} \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
            --split-per-abi

      # The phone installs this file, so its signer is reported rather than
      # assumed. A fingerprint is only useful if it is printed by the build that
      # produced it.
      - name: Report APK signer
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          APK="$(ls build/app/outputs/flutter-apk/*-arm64-v8a-debug.apk | head -1)"
          "$BT/apksigner" verify --print-certs "$APK" > /tmp/smoke-certs.txt
          DN="$(grep -m1 'certificate DN' /tmp/smoke-certs.txt | sed 's/.*DN: //')"
          SHA1="$(grep -m1 'SHA-1 digest' /tmp/smoke-certs.txt | sed 's/.*digest: //')"
          SHA256="$(grep -m1 'SHA-256 digest' /tmp/smoke-certs.txt | sed 's/.*digest: //')"
          echo "smoke APK signer: $DN"
          {
            echo "### Device APK signer"
            echo ""
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| certificate | \`$DN\` |"
            echo "| SHA-1 | \`$SHA1\` |"
            echo "| SHA-256 | \`$SHA256\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$DN" in
            *"Android Debug"*)
              {
                echo ""
                echo "**Registration caveat.** This certificate came from the runner's own"
                echo "debug keystore. Hosted runners generate it per run, so this fingerprint"
                echo "is not stable: register only a dedicated CI debug certificate, and treat"
                echo "Google Sign-In on this APK as unverified until then."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

      - name: Upload production-connected APK
        uses: actions/upload-artifact@v4
        with:
          name: azaman-android-${{ inputs.environment }}-debug
          path: build/app/outputs/flutter-apk/*-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
