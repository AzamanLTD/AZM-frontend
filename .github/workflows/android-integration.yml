name: Android Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in lockstep with flutter-ci.yml — see the note there on why
          # this pin is exact rather than "latest".
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Hosted runners contain large SDKs that are not needed for an APK
      # build. Flutter/Gradle also materialize native build dependencies, so
      # reclaim the known disposable payloads before compilation.
      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk usage before cleanup:"
          df -h /

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo rm -rf /opt/ghc

          echo "Disk usage after cleanup:"
          df -h /

      # The real Firebase configuration is environment-specific and is not
      # committed. When the repository secret GOOGLE_SERVICES_JSON is set it is
      # used verbatim, so this lane builds against the actual project; otherwise
      # a placeholder bound to the production package validates the plugin
      # integration only. See docs/FIREBASE_ANDROID.md.
      - name: Write Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Using the real google-services.json from repository secrets."
          else
            echo "No GOOGLE_SERVICES_JSON secret: using the placeholder configuration."
            cat > android/app/google-services.json << 'GSJSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "storage_bucket": "azaman-ci.appspot.com",
              "project_id": "azaman-ci"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.azaman.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyCI00000000000000000000000000000000" }
                ],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          GSJSON
          fi

      - name: Build Android debug APK
        run: flutter build apk --debug

      # The identity is asserted, not assumed: a rename that misses a manifest,
      # Kotlin package or Gradle field shows up here rather than in Play.
      - name: Verify debug package identity
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          DUMP="$BT/aapt2"; [ -x "$DUMP" ] || DUMP="$BT/aapt"
          PKG="$("$DUMP" dump packagename build/app/outputs/flutter-apk/app-debug.apk)"
          echo "debug apk package: $PKG"
          test "$PKG" = "com.azaman.app" || {
            echo "::error::debug APK package is '$PKG', expected com.azaman.app"
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: azaman-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # Proves the signed release path end to end without ever needing the owner's
  # key in the repository. With the four ANDROID_* secrets present it builds the
  # real uploadable bundle; without them it builds with a throwaway key so the
  # signing wiring is still exercised, and says so in the step summary. The
  # artifact name differs from the debug one on purpose: the integration
  # artifact is untouched.
  release-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Write Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            cat > android/app/google-services.json << 'GSJSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "storage_bucket": "azaman-ci.appspot.com",
              "project_id": "azaman-ci"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.azaman.app" }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyCI00000000000000000000000000000000" }
                ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          GSJSON
          fi

      # A release without a key must STOP. This is the contract the owner asked
      # for, and it is checked here rather than trusted: the build has to fail
      # and it has to say why.
      - name: Release without a key fails clearly
        run: |
          set -euo pipefail
          rm -f android/key.properties
          rm -f android/upload-keystore.jks
          if flutter build appbundle --release > /tmp/nokey.log 2>&1; then
            echo "::error::a release build succeeded without an upload key"
            exit 1
          fi
          grep -q "Release builds are signed with the upload key" /tmp/nokey.log || {
            echo "::error::the failure did not name the missing upload key"
            tail -40 /tmp/nokey.log
            exit 1
          }
          echo "refused as expected:"
          grep -m1 "Release builds are signed with the upload key" /tmp/nokey.log

      - name: Materialise the upload key
        id: key
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "real=true" >> "$GITHUB_OUTPUT"
            echo "Using the repository upload key."
          else
            keytool -genkeypair -v \
              -keystore android/upload-keystore.jks -storetype JKS \
              -keyalg RSA -keysize 2048 -validity 10000 -alias upload \
              -dname "CN=Azaman CI ephemeral, O=Azaman, C=GH" \
              -storepass ci-ephemeral -keypass ci-ephemeral > /dev/null 2>&1
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=ci-ephemeral"
              echo "keyAlias=upload"
              echo "keyPassword=ci-ephemeral"
            } > android/key.properties
            echo "real=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set. This run proves the signing wiring with a throwaway key; the artifact is NOT uploadable to Play."
          fi

      - name: Build signed release
        run: |
          set -euo pipefail
          flutter build appbundle --release
          flutter build apk --release

      - name: Verify release identity and signing certificate
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          APK=build/app/outputs/flutter-apk/app-release.apk
          DUMP="$BT/aapt2"; [ -x "$DUMP" ] || DUMP="$BT/aapt"
          PKG="$("$DUMP" dump packagename "$APK")"
          echo "release apk package: $PKG"
          test "$PKG" = "com.azaman.app" || {
            echo "::error::release package is '$PKG', expected com.azaman.app"
            exit 1
          }
          "$BT/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
          if grep -q "CN=Android Debug" /tmp/certs.txt; then
            echo "::error::the release APK is signed with the debug certificate"
            exit 1
          fi
          {
            echo "### Release identity"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| package | \`$PKG\` |"
            echo "| real upload key | \`${{ steps.key.outputs.real }}\` |"
            echo ""
            echo "```"
            grep -E "Signer #1 certificate (DN|SHA-256 digest)" /tmp/certs.txt || true
            echo "```"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: azaman-android-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # Never leave key material behind, even on a self-hosted or cached runner.
      - name: Remove key material
        if: always()
        run: rm -f android/key.properties android/upload-keystore.jks
