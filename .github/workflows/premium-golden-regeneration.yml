# TEMPORARY — controlled Linux rasterisation machine for the premium goldens.
#
# THIS FILE IS DELETED IN THE SAME PR CYCLE. It exists only to re-rasterise the
# four PremiumGlassContainer goldens in the pinned, deterministic environment
# (Linux + the exact engine the project baseline records) and hand them back as
# an artifact.
#
# Hard constraints, all deliberate:
#   * push-only, and only on this one branch — it cannot fire anywhere else;
#   * `contents: read` — the token has NO write permission, so this workflow
#     physically cannot commit, push, or alter repository state;
#   * it runs ONE named golden test, never a directory;
#   * it uploads only the four named PNGs;
#   * it never regenerates any other golden.
#
# It is a rasteriser, not a committer. A human reviews the artifact and commits
# the four rasters deliberately, in their own commit.
#
# The harness rule in `test/goldens/golden_harness.dart` is untouched: goldens
# are added or deliberately regenerated only, never as a green-build shortcut.

name: TEMP Premium Golden Regeneration

on:
  push:
    branches:
      - local/frontend-revamp

permissions:
  contents: read

concurrency:
  group: temp-golden-regen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rasterise:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/local/frontend-revamp'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # MUST equal the pin in flutter-ci.yml. Golden rasters go through the
          # engine's text and gradient paths, so regenerating under a different
          # engine would bake new drift into the committed baseline.
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Record exact toolchain
        run: |
          set -euo pipefail
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Snapshot the committed rasters for comparison
        run: |
          set -euo pipefail
          mkdir -p /tmp/goldens-before
          cp test/widgets/goldens/*.png /tmp/goldens-before/
          echo "Committed goldens (Roboto baseline) snapshotted:"
          ls -l /tmp/goldens-before/

      - name: Regenerate the scoped golden set
        run: |
          set -euo pipefail
          # Deliberate regeneration of ONE named golden test. Scoped by path so
          # no other golden in the repo can be rewritten.
          flutter test --update-goldens \
            test/widgets/premium_glass_container_golden_test.dart

      - name: Assert exactly the four intended rasters changed
        run: |
          set -euo pipefail
          expected="premium_glass_container_dark.png
          premium_glass_container_v1_dark.png
          premium_glass_container_light.png
          premium_glass_container_v1_light.png"

          echo "Changed under test/widgets/goldens/:"
          git status --porcelain test/widgets/goldens/ | tee /tmp/changed.txt

          count=$(git status --porcelain test/widgets/goldens/ | wc -l | tr -d ' ')
          if [ "$count" -ne 4 ]; then
            echo "::error::expected exactly 4 changed goldens, got $count"
            exit 1
          fi

          while read -r name; do
            base=$(basename "$name")
            if ! grep -qx "$base" <<< "$expected"; then
              echo "::error::unexpected golden touched: $base"
              exit 1
            fi
          done < <(sed 's/^...//' /tmp/changed.txt)

          echo "OK: exactly the four intended goldens changed"

      - name: Assert nothing outside the goldens was modified
        run: |
          set -euo pipefail
          stray=$(git status --porcelain | grep -v 'test/widgets/goldens/' || true)
          if [ -n "$stray" ]; then
            echo "::error::regeneration touched files outside the goldens:"
            echo "$stray"
            exit 1
          fi
          echo "OK: no source, test or doc file was modified"

      - name: Report raster dimensions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct
          files = [
              'premium_glass_container_dark.png',
              'premium_glass_container_v1_dark.png',
              'premium_glass_container_light.png',
              'premium_glass_container_v1_light.png',
          ]
          for name in files:
              path = f'test/widgets/goldens/{name}'
              with open(path, 'rb') as fh:
                  head = fh.read(33)
              w, h = struct.unpack('>II', head[16:24])
              print(f'{name}: {w}x{h}')
          PY

      - name: Upload the four regenerated rasters
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-premium-goldens-linux
          path: |
            test/widgets/goldens/premium_glass_container_dark.png
            test/widgets/goldens/premium_glass_container_v1_dark.png
            test/widgets/goldens/premium_glass_container_light.png
            test/widgets/goldens/premium_glass_container_v1_light.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload the previous Roboto rasters for old-vs-new review
        uses: actions/upload-artifact@v4
        with:
          name: previous-premium-goldens-roboto
          path: /tmp/goldens-before/
          if-no-files-found: ignore
          retention-days: 14

      - name: Note
        if: always()
        run: |
          echo "Rasterisation complete. This workflow committed nothing — it has"
          echo "no write permission. Download the artifact and commit the four"
          echo "PNGs deliberately."
