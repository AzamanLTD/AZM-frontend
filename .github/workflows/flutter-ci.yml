name: Flutter Quality

# One job, one check. It installs dependencies, runs the analyzer and runs the
# complete normal test suite with coverage against the CHECKED-IN golden images.
#
# Golden maintenance is deliberately not part of this workflow. When a change
# intentionally alters a capture, regenerate it locally with the pinned Flutter
# version below, inspect the produced pictures, commit the corrected PNGs, and
# let this job validate the committed files. The pinned SDK produces
# byte-identical output locally and on the runner (verified by sha256 on a
# gradient-heavy capture), so no CI-side recording step is needed or wanted.

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the project's intentional baseline (recorded in
          # AZAMAN_PREMIUM_BUILD_BRIEF.md). The golden-image set is rasterised
          # by the engine's text and gradient paths, so an engine version
          # difference is a real, measurable rendering difference. Bumping this
          # pin requires a deliberate, reviewable golden update in the same
          # change, never a silent drift.
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test with coverage
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

      # Android compilation is intentionally kept out of this job. It runs in
      # the dedicated Android Integration workflow.
