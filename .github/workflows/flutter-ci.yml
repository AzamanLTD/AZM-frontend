name: Flutter Quality

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      update_goldens:
        description: 'Regenerate the native_amount goldens on this runner and upload them as an artifact (the runner image glyph rasterisation differs from dev machines — goldens must be regenerated ON CI, never locally)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: flutter-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the project's intentional baseline (recorded in
          # AZAMAN_PREMIUM_BUILD_BRIEF.md). The golden-image set is rasterised
          # by the engine's text and gradient paths, so an engine version
          # difference is a real, measurable rendering difference — the
          # "Flutter/Dart version" note on `matchesGoldenFile` warns about
          # exactly this. Bumping this pin requires a deliberate reviewable
          # golden regeneration, never a silent drift.
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test with coverage
        if: ${{ !inputs.update_goldens }}
        run: flutter test --coverage

      - name: Regenerate native_amount goldens on the runner
        if: ${{ inputs.update_goldens }}
        run: flutter test --update-goldens test/widgets/native_amount_captures_test.dart

      - name: Upload regenerated goldens
        if: ${{ inputs.update_goldens }}
        uses: actions/upload-artifact@v4
        with:
          name: native-amount-goldens
          path: test/goldens/native_amount/

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

      # Android compilation is intentionally kept out of the PR feedback loop.
      # Run the dedicated integration workflow when a coherent batch is ready.
