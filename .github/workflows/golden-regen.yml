name: Golden Regeneration

# =============================================================================
# RECORD THE GOLDEN IMAGES WHERE THEY WILL BE COMPARED
#
# Why this workflow exists as its own file rather than an input on
# `Flutter Quality`:
#
#   1. The `update_goldens` input on flutter-ci.yml does not reach the job.
#      A dispatch with `{"inputs":{"update_goldens":true}}` returned 204 and
#      then ran `flutter test --coverage` anyway, so the regeneration step was
#      skipped and the run reported the same 30 golden failures it was supposed
#      to fix. A step that silently does not run is worse than no step: it
#      looks like an attempt. `workflow_dispatch` with no inputs has nothing to
#      mis-plumb.
#
#   2. The rule at stake is in flutter-ci.yml's own words: goldens must be
#      regenerated ON CI, never locally. Measured on front_saved_390_dark, a
#      dev-machine golden and this runner's render correlate at 0.999 (the same
#      picture) while differing by a ~2% luminance shift across the whole face,
#      which is enough to fail the 2% pixel tolerance. Every golden recorded on
#      a dev machine is therefore a guaranteed red on this runner, whatever the
#      widget actually looks like.
#
# This workflow regenerates EVERY suite that calls matchesGoldenFile — all of
# them, because a golden set is only as reproducible as its least-reproducible
# member — and uploads the images. They get committed from the artifact; nobody
# hand-copies a PNG from a laptop again.
#
# It never commits, never pushes and holds `contents: read`: the artifact is
# the deliverable and the commit is reviewed like any other.
# =============================================================================

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: golden-regen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # The SAME pin as Flutter Quality. A golden recorded on a different
          # engine is a different picture — bumping this pin and regenerating
          # must happen together, never one without the other.
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate every golden suite on the runner
        run: |
          set -o pipefail
          flutter test --update-goldens --concurrency=1 \
            test/widgets/native_amount_captures_test.dart \
            test/widgets/card_transfer_captures_test.dart \
            test/widgets/balance_card_fx_captures_test.dart \
            test/widgets/shell_responsive_captures_test.dart \
            test/widgets/convert_captures_test.dart \
            test/send/send_visual_captures_test.dart \
            test/widgets/home_entrance_test.dart \
            test/widgets/liquid/liquid_golden_test.dart \
            test/widgets/premium_glass_container_golden_test.dart \
            test/widgets/premium_nav_golden_test.dart \
            2>&1 | tee /tmp/regen.log
          # A regenerating run must still not FAIL. If a capture suite throws
          # (a layout overflow, a missing font, an assertion), regenerating
          # would paper over it: the new image would simply record the broken
          # frame. Failing here keeps that impossible.
          if grep -q "Some tests failed" /tmp/regen.log; then
            echo "::error::A capture suite failed while regenerating; the new goldens would record a broken frame."
            exit 1
          fi

      - name: Summarise what changed in size
        run: |
          git status --short | tee /tmp/status.txt
          COUNT=$(grep -c '^ M' /tmp/status.txt || true)
          echo "### Golden regeneration" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Changed files: **${COUNT}**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -60 /tmp/status.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload regenerated goldens
        uses: actions/upload-artifact@v4
        with:
          name: goldens
          # Every golden directory in the repo, so one artifact is enough to
          # commit the whole set.
          path: |
            test/goldens/
            test/widgets/goldens/
            test/send/
            test/widgets/failures/
          if-no-files-found: error
          retention-days: 14
