name: Transit server fare patch v2

on:
  push:
    branches: [fix/transit-success-use-server-fare]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/transit-success-use-server-fare
      - name: Patch fare source
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/marketplace/transit_seat_selection_screen.dart')
          s = p.read_text()
          old = "      final selected = ref.read(selectedSeatsProvider);\n      final total = _totalFare(availability, selected);\n\n      ref.invalidate(seatAvailabilityProvider(widget.tripId));"
          new = "      final selected = ref.read(selectedSeatsProvider);\n      final total = result.totalFare;\n\n      ref.invalidate(seatAvailabilityProvider(widget.tripId));"
          if old not in s: raise SystemExit('target block not found')
          p.write_text(s.replace(old, new, 1))
          Path('test/screens/marketplace/transit_seat_selection_server_fare_test.dart').write_text("""import 'dart:io';\n\nimport 'package:flutter_test/flutter_test.dart';\n\nvoid main() {\n  test('success sheet displays server-authoritative booking fare', () {\n    final source = File('lib/screens/marketplace/transit_seat_selection_screen.dart').readAsStringSync();\n    expect(source, contains('final total = result.totalFare;'));\n    expect(source, isNot(contains('final total = _totalFare(availability, selected);')));\n  });\n}\n""")
          Path('.github/workflows/transit-server-fare-patch.yml').unlink()
          Path('.github/workflows/transit-server-fare-patch-v2.yml').unlink()
          import subprocess
          subprocess.run(['git','config','user.name','azaman-automation'], check=True)
          subprocess.run(['git','config','user.email','automation@azaman.local'], check=True)
          subprocess.run(['git','add','-A'], check=True)
          subprocess.run(['git','commit','-m','fix(transit): display server-authoritative booking fare'], check=True)
          subprocess.run(['git','push','origin','HEAD:fix/transit-success-use-server-fare'], check=True)
          PY
