name: Centralize trade update listeners

on:
  push:
    branches:
      - refactor/centralize-trade-update-listeners

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard and migrate trade update listener API
        run: |
          python3 - <<'PY'
          from pathlib import Path

          s = Path('lib/services/socket_service.dart').read_text()
          old = """  void Function(Map<String, dynamic>)? _onTradeUpdate;"""
          new = """  final Set<void Function(Map<String, dynamic>)> _tradeUpdateListeners = <void Function(Map<String, dynamic>)>{};"""
          assert old in s, 'SocketService trade callback anchor missing'
          s = s.replace(old, new, 1)
          old = """  void onTradeUpdate(void Function(Map<String, dynamic>) cb) => _onTradeUpdate = cb;"""
          new = """  void onTradeUpdate(void Function(Map<String, dynamic>) cb) => _tradeUpdateListeners.add(cb);\n  void removeTradeUpdateListener(void Function(Map<String, dynamic>) cb) => _tradeUpdateListeners.remove(cb);"""
          assert old in s, 'SocketService registration anchor missing'
          s = s.replace(old, new, 1)
          old = """    socket.on('trade_update', (data) => _safeMapCallback(_onTradeUpdate, data, 'trade_update'));"""
          new = """    socket.on('trade_update', (data) => _dispatchMapListeners(_tradeUpdateListeners, data, 'trade_update'));"""
          assert old in s, 'SocketService dispatch anchor missing'
          s = s.replace(old, new, 1)
          old = """    _onTradeUpdate = null;"""
          new = """    _tradeUpdateListeners.clear();"""
          assert old in s, 'SocketService dispose anchor missing'
          s = s.replace(old, new, 1)
          Path('lib/services/socket_service.dart').write_text(s)

          p = Path('lib/screens/active_trade_screen.dart')
          s = p.read_text()
          old = """    socket.on('trade_update', _onTradeUpdate);"""
          new = """    SocketService.instance.onTradeUpdate(_onTradeUpdateMap);"""
          assert old in s, 'ActiveTrade trade_update registration anchor missing'
          s = s.replace(old, new, 1)
          old = """  void _onTradeUpdate(dynamic data) {"""
          new = """  void _onTradeUpdateMap(Map<String, dynamic> data) {"""
          assert old in s, 'ActiveTrade handler anchor missing'
          s = s.replace(old, new, 1)
          old = """    socket.off('trade_update', _onTradeUpdate);"""
          new = """    SocketService.instance.removeTradeUpdateListener(_onTradeUpdateMap);"""
          assert old in s, 'ActiveTrade cleanup anchor missing'
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Verify migration shape
        run: |
          grep -Fq '_tradeUpdateListeners' lib/services/socket_service.dart
          grep -Fq 'onTradeUpdate(_onTradeUpdateMap)' lib/screens/active_trade_screen.dart
          ! grep -Fq "socket.on('trade_update', _onTradeUpdate)" lib/screens/active_trade_screen.dart
          ! grep -Fq "socket.off('trade_update', _onTradeUpdate)" lib/screens/active_trade_screen.dart

      - name: Remove temporary workflow and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/socket_service.dart lib/screens/active_trade_screen.dart
          git diff --cached --exit-code -- .github/workflows/centralize-trade-update.yml && exit 1 || true
          git add -u .github/workflows/centralize-trade-update.yml
          git commit -m 'refactor(realtime): centralize trade update listeners' || git commit --allow-empty -m 'refactor(realtime): centralize trade update listeners'
          git push
