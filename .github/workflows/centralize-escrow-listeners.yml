name: Centralize escrow socket listeners

on:
  push:
    branches:
      - refactor/centralize-escrow-socket-listeners

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard and migrate escrow listener API
        shell: python
        run: |
          from pathlib import Path

          socket = Path('lib/services/socket_service.dart')
          ticket = Path('lib/screens/tickets/ticket_workspace_screen.dart')
          s = socket.read_text()
          t = ticket.read_text()

          socket_anchors = [
              "void Function(Map<String, dynamic>, String)? _onEscrowEvent;",
              "void onEscrowEvent(void Function(Map<String, dynamic>, String) cb) => _onEscrowEvent = cb;",
              "_onEscrowEvent = null;",
              "_onEscrowEvent?.call(_toMap(data), event);",
          ]
          for anchor in socket_anchors:
              if anchor not in s:
                  raise SystemExit(f'missing SocketService anchor: {anchor}')

          ticket_anchors = [
              "final List<MapEntry<String, void Function(dynamic)>> _escrowSubs = [];",
              "void _wireEscrowSocket() {",
              "void _unwireEscrowSocket() {",
              "        _wireEscrowSocket();",
              "    _unwireEscrowSocket();",
          ]
          for anchor in ticket_anchors:
              if anchor not in t:
                  raise SystemExit(f'missing TicketWorkspace anchor: {anchor}')

          s = s.replace(
              "  void Function(Map<String, dynamic>, String)? _onEscrowEvent;",
              "  final Set<void Function(Map<String, dynamic>, String)> _escrowListeners = <void Function(Map<String, dynamic>, String)>{};",
              1,
          )
          s = s.replace(
              "  void onEscrowEvent(void Function(Map<String, dynamic>, String) cb) => _onEscrowEvent = cb;",
              "  void onEscrowEvent(void Function(Map<String, dynamic>, String) cb) => _escrowListeners.add(cb);\n  void removeEscrowEventListener(void Function(Map<String, dynamic>, String) cb) => _escrowListeners.remove(cb);",
              1,
          )
          s = s.replace("    _onEscrowEvent = null;", "    _escrowListeners.clear();", 1)
          s = s.replace(
              "      _onEscrowEvent?.call(_toMap(data), event);",
              "      final payload = _toMap(data);\n      for (final cb in List<void Function(Map<String, dynamic>, String)>.from(_escrowListeners)) {\n        try {\n          cb(payload, event);\n        } catch (callbackError) {\n          debugPrint('[SocketService] $event listener error: $callbackError');\n        }\n      }",
              1,
          )

          old_block = '''  // V3 Marketplace Sprint (2026-06-21): per-ticket escrow socket subscriptions.\n  // We keep the handler refs so dispose() can `off(event, handler)` precisely —\n  // a bare `off(event)` would also nuke SocketService's own dispatcher for that\n  // event name.\n  static const _escrowEvents = [\n    'escrow_funded',\n    'escrow_settled',\n    'escrow_pending_settlement',\n    'escrow_disputed',\n    'escrow_resolved',\n    'escrow_terms_updated',\n  ];\n  final List<MapEntry<String, void Function(dynamic)>> _escrowSubs = [];\n'''
          t = t.replace(old_block, "  late final void Function(Map<String, dynamic>, String) _escrowHandler;\n  bool _escrowListening = false;\n", 1)

          old_init = '''      if (loaded?.type == TicketType.escrow) {\n        ref.read(escrowProvider(widget.ticketId).notifier).load();\n        _wireEscrowSocket();\n      }\n'''
          t = t.replace(old_init, '''      if (loaded?.type == TicketType.escrow) {\n        ref.read(escrowProvider(widget.ticketId).notifier).load();\n        ref.read(socketServiceProvider).onEscrowEvent(_escrowHandler);\n        _escrowListening = true;\n      }\n''', 1)

          old_dispose = '''    _leaveRoom();\n    _unwireEscrowSocket();\n    _messageCtrl.dispose();\n'''
          t = t.replace(old_dispose, '''    _leaveRoom();\n    if (_escrowListening) {\n      ref.read(socketServiceProvider).removeEscrowEventListener(_escrowHandler);\n    }\n    _messageCtrl.dispose();\n''', 1)

          start = t.index('  void _wireEscrowSocket() {')
          end = t.index('  @override\n  void didChangeAppLifecycleState', start)
          replacement = '''  void _registerEscrowHandler() {\n    _escrowHandler = (raw, evt) {\n      if (!mounted || raw['ticketId']?.toString() != widget.ticketId) return;\n      ref\n          .read(escrowProvider(widget.ticketId).notifier)\n          .onRealtimeUpdate(raw, evt);\n      if (evt == 'escrow_settled') AzamanHaptics.confirm();\n      if (evt == 'escrow_disputed') AzamanHaptics.warn();\n    };\n  }\n\n'''
          t = t[:start] + replacement + t[end:]

          init_marker = '''    WidgetsBinding.instance.addObserver(this);'''
          if init_marker not in t:
              raise SystemExit('ticket lifecycle marker unexpectedly missing')
          t = t.replace(init_marker, init_marker + "\n    _registerEscrowHandler();", 1)

          socket.write_text(s)
          ticket.write_text(t)

      - name: Verify migration shape
        run: |
          grep -q "_escrowListeners" lib/services/socket_service.dart
          grep -q "removeEscrowEventListener" lib/services/socket_service.dart
          grep -q "onEscrowEvent(_escrowHandler)" lib/screens/tickets/ticket_workspace_screen.dart
          ! grep -q "_escrowEvents\|_escrowSubs\|void _wireEscrowSocket\|void _unwireEscrowSocket" lib/screens/tickets/ticket_workspace_screen.dart
          ! grep -q "onEscrowEvent.*_onEscrowEvent" lib/services/socket_service.dart

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/centralize-escrow-listeners.yml .ci/centralize-escrow-listeners-trigger.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/socket_service.dart lib/screens/tickets/ticket_workspace_screen.dart .github/workflows/centralize-escrow-listeners.yml .ci/centralize-escrow-listeners-trigger.md
          git diff --cached --quiet && exit 0
          git commit -m 'refactor(realtime): centralize escrow listeners'
          git push