name: azaman
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.7 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management — Riverpod is the canonical state-management layer.
  # The legacy `provider` package was removed in Phase 0b (Root Strip).
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Real-time Communication (Binance-style updates)
  socket_io_client: ^3.1.2
  
  # API Requests & Success Animations
  http: ^1.6.0
  lottie: ^3.3.2

  # Secure storage for JWT
  flutter_secure_storage: ^10.0.0

  # Local storage for Theme Engine & Preferences
  shared_preferences: ^2.2.2

  # For proof of payment uploads
  image_picker: ^1.2.1

  # `image_cropper` lets users crop/rotate photos before sending in chat.
  image_cropper: ^8.0.2

  # Restaurant flip-book menu (pinned — proprietary license, approved-PR-only upstream)
  turnable_page:
    git:
      url: https://github.com/saeedahmed725/turnable_page.git
      ref: e8ad982c8e7c0ba9f8665274fbc5f604da8dc751

  # --- SURGICALLY ADDED FOR TRADE EFFICIENCY ---
  # Fixes canLaunchUrl & LaunchMode errors
  url_launcher: ^6.3.0  
  # Fixes Undefined name 'Share' error
  share_plus: ^12.0.2
  google_maps_flutter: ^2.9.0
  # For Binance-style haptic feedback (vibration)
  vibration: ^2.0.1      
  # ----------------------------------------------

  # --- PUSH NOTIFICATION ENGINE ---
  # Using the specific stable versions to fix "version solving failed"
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^18.0.1
  # ----------------------------------------------

  # --- CRASH / ERROR MONITORING (F-05) ---
  # Inert unless --dart-define=SENTRY_DSN=... is passed at build time.
  sentry_flutter: ^9.22.0
  # ----------------------------------------------

  # Audio recording for account deletion feedback

  # Essential for handling file system paths
  path: ^1.9.1
  path_provider: ^2.1.5

  cupertino_icons: ^1.0.8

  # War Room charts
  fl_chart: ^0.70.2

  # QR code generation for deposit addresses
  qr_flutter: ^4.1.0

  # QR code scanning for friend-add via camera
  # Pinned to 7.x (not the original ^5.1.1 from the QR-scanner Pre-Ship phase)
  # because mobile_scanner 5.x relies on GoogleMLKit on iOS, and Google does
  # not ship arm64 simulator slices for those frameworks. That makes the app
  # un-runnable on Apple Silicon iOS 26+ simulators. mobile_scanner 7.x
  # switched to Apple's native Vision framework on iOS — no MLKit, no
  # simulator arch block. Public Dart API used by qr_scanner_screen.dart
  # (`MobileScannerController`, `MobileScanner`, `BarcodeCapture`,
  # `DetectionSpeed`, `CameraFacing`, `toggleTorch()`) is unchanged.
  mobile_scanner: ^7.2.0

  # Biometric authentication for crypto transfers
  local_auth: ^2.1.0
  record: ^6.2.0

  # --- PHASE Q11: Receipt download + open ---
  open_filex: ^4.5.0

  # --- PHASE Q15: Version gate (force-update) ---
  package_info_plus: ^8.0.0

  # --- PHASE POLISH: Custom typography (Inter) ---
  google_fonts: ^6.2.1

  # --- MASTER SPRINT v2 (2026-05-27): Custom iconography ---
  # Hugeicons Pro gives us a curated, design-coherent icon family that
  # immediately reads as not-stock-Material. Used for primary CTAs and
  # any icon that ships outside a stock Flutter widget so the platform
  # has a recognisable identity.
  hugeicons_pro: ^0.0.3

  # --- PHASE UI-3: Chat media (audio recording is via `record`, image picking
  # via `image_picker`, document picking via `file_picker`). ---
  file_picker: ^8.1.4

  # --- PHASE UI-POLISH: In-bubble audio playback with scrubber.
  # `record` (already in) handles capture; `audioplayers` handles playback.
  audioplayers: ^6.1.0

  # --- PHASE H4: Network awareness ---
  # Surfaces an "Offline" banner the moment the device loses network so users
  # don't sit in front of a spinning fetch with no signal. Watches radio
  # state changes (wifi / mobile / ethernet / none).
  connectivity_plus: ^6.1.0
  flutter_webrtc: ^0.12.0

  # --- PHASE UI-OVERHAUL: Premium micro-interactions (gskinner) ---
  # `flutter_animate` is the canonical micro-interaction layer for the
  # Azaman UI. Every fade / slide / shimmer / blur on widget mount goes
  # through its extension methods. Manual AnimationController
  # boilerplate is forbidden for simple effects — only complex
  # multi-controller geometry (e.g. the credit-card titanium sweep,
  # the in-place flip overlay) is allowed to keep its own controller.
  flutter_animate: ^4.5.0
  flutter_svg: ^2.3.0

  # --- UI/UX SPRINT (2026-07-08): Material motion transitions ---
  # Official Flutter-team package. Used for:
  #   - Container transform (OpenContainer): bubble→sheet, story tap open/close,
  #     chat attachment menu open, info popover open/close
  #   - Shared axis (SharedAxisTransition): business profile pill-tab switches
  #   - Fade through (FadeThroughTransition): bottom nav tab switches
  animations: ^2.2.0

  # --- FLUTTER V3 MARKETPLACE SPRINT (2026-06-21) ---
  # `geolocator` resolves the user's GPS coordinates for the "Near You"
  # nearby-business search (/api/business/search/nearby?lat=&lng=).
  # `cached_network_image` caches product / business / location photos so
  # marketplace grids don't re-fetch the same Cloudinary URLs on every
  # scroll. Both are additive — no existing code depends on them yet.
  geolocator: ^13.0.1
  cached_network_image: ^3.4.1

  # `video_player` plays story videos and video content in feeds.
  # Pinned to 2.9.x for API stability.
  video_player: ^2.9.2

  # --- CHATS · NOTIFICATIONS · TRANSACTIONS SPRINT (2026-06-28) ---
  # PDF printing & generation for ticket/transaction exports
  printing: ^5.12.0
  pdf: ^3.10.7
  # Sticker pack caching
  flutter_cache_manager: ^3.3.1
  # Shimmer loading on transaction history rows
  shimmer: ^3.0.0
  # Date formatting for date-separator chips
  intl: ^0.19.0
  # Optional — emoji shortcode in sticker packs
  dart_emoji: ^0.2.0
  flutter_contacts: ^2.1.0
  crypto: ^3.0.7
  pinenacl: ^0.6.0  # X25519 + NaCl box for E2EE
  hugeicons: ^1.1.7

  uuid: any
  http_parser: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: 2.4.7

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/azaman_logo_padded.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/azaman_logo_padded.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # Binance-style assets
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/stickers/static/
    - assets/stickers/animated/
    - assets/chat_wallpapers/

  # Bundled Inter variable font (replaces runtime GoogleFonts.inter() fetch
  # from fonts.gstatic.com — that network round-trip was adding load-time
  # latency + a flash-of-unstyled-content on first paint, especially on web).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

dependency_overrides:
  objective_c: 9.3.0
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/azaman_logo_splash.png"
  android_12:
    image: "assets/images/azaman_logo_splash.png"
    color: "#FFFFFF"

