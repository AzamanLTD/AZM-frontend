  <!--
    AZAMAN three-tier mark — vector master.
    Source: owner-supplied AZMSilverSVG (1024x1024 artboard with a dark
    background plate and metallic gradients). This asset is the same three
    paths, with the plate and the gradient defs removed and the fills set to
    white so the card can tint them to its own ink. The viewBox is cropped to
    the glyph's TRUE bezier bounding box (x 224.4-799.6, y 214-770.2) so the
    mark fills the box it is given instead of sitting inside 1024-square
    padding — this is what makes it land exactly on the card's logo slot.
    Never rasterise this file: it is drawn as vectors at every size.
  -->
